<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Exploded Assembly - VR Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #overlay {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 14px 18px; background: rgba(0,0,0,0.6); color: white;
      font-size: 14px; z-index: 10; pointer-events: none;
    }
  </style>
</head>
<body>

<div id="overlay">
  Pinch (thumb + index) near the model to grab it and move it around. Trigger buttons work too if hand tracking isn't active. Click-drag to look around on desktop.
</div>

<script>
  // Custom component: lets a hand (or controller) grab the nearest grabbable
  // object on pinch/trigger, move it 1:1 with the hand, and release on
  // pinch-end. Works with A-Frame's built-in hand-tracking-controls events
  // (pinchstarted / pinchmoved / pinchended) and controller select events.
  AFRAME.registerComponent('hand-grabber', {
    schema: { grabDistance: { type: 'number', default: 0.35 } },

    init: function () {
      this.grabbedEl = null;
      this.offset = new THREE.Vector3();
      this.handQuatStart = new THREE.Quaternion();
      this.objQuatStart = new THREE.Quaternion();

      this.onPinchStart = this.onGrabStart.bind(this);
      this.onPinchMove = this.onGrabMove.bind(this);
      this.onPinchEnd = this.onGrabEnd.bind(this);

      // Hand tracking pinch events (built in to A-Frame's hand-tracking-controls)
      this.el.addEventListener('pinchstarted', this.onPinchStart);
      this.el.addEventListener('pinchmoved', this.onPinchMove);
      this.el.addEventListener('pinchended', this.onPinchEnd);

      // Controller fallback (trigger/select button)
      this.el.addEventListener('selectstart', this.onPinchStart);
      this.el.addEventListener('selectend', this.onPinchEnd);
    },

    tick: function () {
      // For controllers (no pinchmoved event), keep updating while grabbed
      if (this.grabbedEl && this.usingController) {
        this.onGrabMove();
      }
    },

    onGrabStart: function (evt) {
      var handPos = new THREE.Vector3();
      this.el.object3D.getWorldPosition(handPos);

      var model = document.querySelector('#model');
      var modelPos = new THREE.Vector3();
      model.object3D.getWorldPosition(modelPos);

      var dist = handPos.distanceTo(modelPos);
      if (dist > this.data.grabDistance) return; // too far, ignore

      this.usingController = evt.type === 'selectstart';
      this.grabbedEl = model;
      this.offset.copy(modelPos).sub(handPos);
      this.el.object3D.getWorldQuaternion(this.handQuatStart);
      this.grabbedEl.object3D.getWorldQuaternion(this.objQuatStart);

      var status = document.querySelector('#status');
      if (status) status.setAttribute('value', 'Grabbed');
    },

    onGrabMove: function () {
      if (!this.grabbedEl) return;
      var handPos = new THREE.Vector3();
      var handQuat = new THREE.Quaternion();
      this.el.object3D.getWorldPosition(handPos);
      this.el.object3D.getWorldQuaternion(handQuat);

      // Move: hand position + original offset, rotated by hand's rotation delta
      var deltaQuat = handQuat.clone().multiply(this.handQuatStart.clone().invert());
      var rotatedOffset = this.offset.clone().applyQuaternion(deltaQuat);

      var newPos = handPos.clone().add(rotatedOffset);
      this.grabbedEl.object3D.position.copy(
        this.grabbedEl.object3D.parent.worldToLocal(newPos.clone())
      );

      // Rotate model with the hand
      var newObjQuat = deltaQuat.clone().multiply(this.objQuatStart);
      this.grabbedEl.object3D.quaternion.copy(newObjQuat);
    },

    onGrabEnd: function () {
      this.grabbedEl = null;
      var status = document.querySelector('#status');
      if (status) status.setAttribute('value', 'Released');
    }
  });

  // Reset button component
  AFRAME.registerComponent('reset-button', {
    init: function () {
      this.el.addEventListener('click', function () {
        var model = document.querySelector('#model');
        model.setAttribute('position', '0 1.3 -1.2');
        model.setAttribute('rotation', '0 0 0');
      });
    }
  });
</script>

<a-scene xr-mode-ui="enabled: true" webxr="optionalFeatures: hand-tracking, local-floor, bounded-floor;" gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.7/;">

  <a-assets>
    <a-asset-item id="planeModel" src="Assembly_exploded_VR_compressed.glb"></a-asset-item>
  </a-assets>

  <!-- Lighting -->
  <a-entity light="type: ambient; intensity: 0.7; color: #ffffff"></a-entity>
  <a-entity light="type: directional; intensity: 0.8; color: #ffffff" position="2 4 3"></a-entity>

  <!-- Environment -->
  <a-sky color="#cfe8f5"></a-sky>
  <a-plane rotation="-90 0 0" width="20" height="20" color="#7d8f75" material="roughness: 1"></a-plane>

  <!-- The model -->
  <a-entity id="model" gltf-model="#planeModel" position="0 1.3 -1.2" scale="1 1 1" shadow="cast: true"></a-entity>

  <!-- Status text -->
  <a-text id="status" value="Ready" position="0 2.4 -1.5" align="center" color="#222" width="4"></a-text>

  <!-- Reset button, works with click, controller ray, or pinch-select -->
  <a-entity position="0 0.6 -1.5">
    <a-plane class="clickable" reset-button width="0.5" height="0.18" color="#3b5998"></a-plane>
    <a-text value="Reset Model" align="center" position="0 0 0.01" color="#ffffff" width="2.2"></a-text>
  </a-entity>

  <!-- Rig: camera + hands + controllers -->
  <a-entity id="rig" movement-controls position="0 0 0.6">
    <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>

    <a-entity id="leftHand"
      hand-tracking-controls="hand: left; modelStyle: mesh"
      hand-grabber
      laser-controls="hand: left"
      raycaster="objects: .clickable"
      oculus-touch-controls="hand: left"></a-entity>

    <a-entity id="rightHand"
      hand-tracking-controls="hand: right; modelStyle: mesh"
      hand-grabber
      laser-controls="hand: right"
      raycaster="objects: .clickable"
      oculus-touch-controls="hand: right"></a-entity>
  </a-entity>

</a-scene>

</body>
</html>
